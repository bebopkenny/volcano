# One entry per case. Every onset must record its source.
# Times are UTC. Windows are whole UTC days, inclusive.
cases:
  - id: mauna-loa-2022
    volcano: Mauna Loa
    region: Hawaii, USA
    lat: 19.475
    lon: -155.608
    type: eruption
    # USGS HVO: eruption began about 11:30 p.m. HST on Nov 27, 2022 in
    # Mokuaweoweo caldera. HST is UTC-10, so 09:30 UTC on Nov 28.
    onset: "2022-11-28T09:30:00Z"
    window_start: "2022-08-29"
    window_end: "2022-12-10"
    fdsn_url: https://service.earthscope.org
    network: HV
    station: MOKD   # broadband on the summit caldera rim, running since 2010
    channel: HHZ
    sources:
      - "USGS HVO: https://www.usgs.gov/volcanoes/mauna-loa/science/november-27-december-10-2022-eruption-mauna-loa"
      - "GVP volcano 332020 (cross check pending)"

  - id: kilauea-2020
    volcano: Kilauea
    region: Hawaii, USA
    lat: 19.405     # Halemaumau crater
    lon: -155.281
    type: eruption
    # USGS HVO: glow first seen in Halemaumau shortly after 9:30 p.m. HST on Dec 20, 2020,
    # ending a two year pause. HST is UTC-10, so 07:30 UTC on Dec 21.
    onset: "2020-12-21T07:30:00Z"
    window_start: "2020-09-21"
    window_end: "2021-01-01"
    fdsn_url: https://service.earthscope.org
    network: HV
    station: UWE    # Uwekahuna, broadband on the summit caldera rim
    channel: HHZ
    sources:
      - "USGS HVO: https://www.usgs.gov/volcanoes/kilauea/news/photo-and-video-chronology-kilauea-december-20-2020"

  - id: shishaldin-2023
    volcano: Shishaldin
    region: Alaska, USA
    lat: 54.756
    lon: -163.970
    type: eruption
    # AVO raised to YELLOW on Jul 11, 2023 for strongly elevated summit temperatures, then
    # ORANGE on Jul 12 after incandescence in webcam images "last night" showed lava was
    # likely in the summit crater. No exact onset time is published; 06:00 UTC Jul 12 is
    # 22:00 AKDT Jul 11, the start of that night. Approximate to within about a day.
    onset: "2023-07-12T06:00:00Z"
    window_start: "2023-04-12"
    window_end: "2023-07-24"
    fdsn_url: https://service.earthscope.org
    network: AV
    station: SSLS   # 5.5 km from the summit
    channel: BHZ
    sources:
      - "AVO HANS: https://avo.alaska.edu/news/hans/DOI-USGS-AVO-2023-07-18T13:13:17-08:00"
      - "AVO HANS: https://volcanoes.usgs.gov/hans-public/notice/DOI-USGS-AVO-2023-07-18T06:10:01-08:00"

  - id: great-sitkin-2021
    volcano: Great Sitkin
    region: Alaska, USA
    lat: 52.076
    lon: -176.130
    type: eruption
    # AVO: explosion at 21:04 AKDT on May 25, 2021 (05:04 UTC May 26), after about 24 hours
    # of long period earthquakes. Lava effusion followed from mid July 2021.
    onset: "2021-05-26T05:04:00Z"
    window_start: "2021-02-25"
    window_end: "2021-06-07"
    fdsn_url: https://service.earthscope.org
    network: AV
    station: GSTD   # 2.5 km from the summit
    channel: BHZ
    sources:
      - "AVO image and caption: https://avo.alaska.edu/images/image.php?id=170261"

  - id: spurr-2025
    volcano: Mount Spurr
    region: Alaska, USA
    lat: 61.299
    lon: -152.251
    type: unrest
    # AVO: earthquakes rose from April 2024 and peaked early 2025; AVO said in Feb 2025 an
    # eruption was possible. By June 2025 the intrusion had stalled. No eruption.
    window_start: "2025-01-01"
    window_end: "2025-04-30"
    fdsn_url: https://service.earthscope.org
    network: AV
    station: SPCP   # 6.3 km from the summit
    channel: BHZ
    sources:
      - "AVO HANS: https://avo.alaska.edu/news/hans/DOI-USGS-AVO-2025-02-07T01:17:45+00:00"
      - "AVO HANS: https://avo.alaska.edu/news/hans/DOI-USGS-AVO-2025-06-13T18:14:45+00:00"

  - id: kilauea-2024-intrusion
    volcano: Kilauea
    region: Hawaii, USA
    lat: 19.405
    lon: -155.281
    type: unrest
    # USGS HVO: Oct 2023 and Jan 31 to Feb 2, 2024 dike intrusions southwest of the summit,
    # alert raised to WATCH on Jan 31 then lowered Feb 3. No eruption until Jun 3, 2024,
    # over 90 days after this window ends.
    window_start: "2023-11-15"
    window_end: "2024-02-29"
    fdsn_url: https://service.earthscope.org
    network: HV
    station: UWE
    channel: HHZ
    sources:
      - "USGS HVO: https://volcanoes.usgs.gov/hans-public/notice/DOI-USGS-HVO-2024-02-01T19:44:10+00:00"
      - "USGS HVO: https://www.usgs.gov/observatories/hvo/news/volcano-watch-kilauea-intrusion-was-a-textbook-example-dike-propagation"

  # Added 2026-10-14 to get more eruptions (Run 1 and Run 2 had only 4). Each Kilauea
  # window starts after the previous eruption ended, so no window holds an ongoing eruption.
  - id: kilauea-2021
    volcano: Kilauea
    region: Hawaii, USA
    lat: 19.405
    lon: -155.281
    type: eruption
    # USGS: began about 3:20 p.m. HST Sep 29, 2021 in Halemaumau (01:20 UTC Sep 30).
    # The previous eruption ended May 23, 2021.
    onset: "2021-09-30T01:20:00Z"
    window_start: "2021-07-01"
    window_end: "2021-10-11"
    fdsn_url: https://service.earthscope.org
    network: HV
    # not UWE: its sensor misbehaved Aug to Oct 2021 (2 to 5 Hz amplitude 0.02 to 26 times
    # that of SDH and RIMD, which agree with each other) and that epoch ends 2021-10-27
    station: SDH
    channel: HHZ
    sources:
      - "USGS: https://www.usgs.gov/news/new-eruption-k-lauea-summit"

  - id: kilauea-2023-jun
    volcano: Kilauea
    region: Hawaii, USA
    lat: 19.405
    lon: -155.281
    type: eruption
    # USGS HVO: began about 4:44 a.m. HST Jun 7, 2023 in Halemaumau (14:44 UTC).
    # The previous eruption ended Mar 7, 2023.
    onset: "2023-06-07T14:44:00Z"
    window_start: "2023-03-08"
    window_end: "2023-06-19"
    fdsn_url: https://service.earthscope.org
    network: HV
    station: UWE
    channel: HHZ
    sources:
      - "NPS: https://home.nps.gov/havo/learn/nature/june-2023-summit-eruption.htm"
      - "USGS HVO: https://www.usgs.gov/observatories/hvo/news/photo-and-video-chronology-kilauea-summit-eruption-june-8-2023"

  - id: kilauea-2023-sep
    volcano: Kilauea
    region: Hawaii, USA
    lat: 19.405
    lon: -155.281
    type: eruption
    # USGS HVO: began about 3:15 p.m. HST Sep 10, 2023 (01:15 UTC Sep 11), after about an
    # hour of rising seismicity. The previous eruption ended Jun 19, 2023.
    onset: "2023-09-11T01:15:00Z"
    window_start: "2023-06-20"
    window_end: "2023-09-22"
    fdsn_url: https://service.earthscope.org
    network: HV
    station: UWE
    channel: HHZ
    sources:
      - "USGS HVO: https://www.usgs.gov/observatories/hvo/news/photo-and-video-chronology-kilauea-summit-september-18-2023"

  - id: kilauea-2024-jun
    volcano: Kilauea
    region: Hawaii, USA
    lat: 19.405
    lon: -155.281
    type: eruption
    # USGS: 8.5 hour eruption about 4 km southwest of the caldera, began 12:30 a.m. HST
    # Jun 3, 2024 (10:30 UTC). Window starts after the kilauea-2024-intrusion window ends.
    onset: "2024-06-03T10:30:00Z"
    window_start: "2024-03-05"
    window_end: "2024-06-15"
    fdsn_url: https://service.earthscope.org
    network: HV
    station: UWE
    channel: HHZ
    sources:
      - "USGS: https://www.usgs.gov/volcanoes/kilauea/science/june-2024-kilauea-southwest-rift-zone-eruption"

  - id: kilauea-2024-dec
    volcano: Kilauea
    region: Hawaii, USA
    lat: 19.405
    lon: -155.281
    type: eruption
    # USGS HVO (via Friends of HVNP): eruptive activity seen in webcams by 2:30 a.m. HST
    # Dec 23, 2024 (12:30 UTC). The previous eruption (middle East Rift) ended Sep 20, 2024.
    onset: "2024-12-23T12:30:00Z"
    window_start: "2024-09-24"
    window_end: "2025-01-04"
    fdsn_url: https://service.earthscope.org
    network: HV
    station: UWE
    channel: HHZ
    sources:
      - "Friends of HVNP citing HVO: https://www.fhvnp.org/blog/kilauea-erupts-december-23-2024"
      - "USGS: https://www.usgs.gov/maps/march-18-2025-kilauea-summit-eruption-reference-map"

  - id: pavlof-2021
    volcano: Pavlof
    region: Alaska, USA
    lat: 55.417
    lon: -161.894
    type: eruption
    # AVO: tremor from Jul 9, 2021 (YELLOW). Webcams showed ash bursts from a new vent on
    # Aug 5, and AVO raised to ORANGE in a notice at 09:55 AKDT (17:55 UTC). The first ash
    # was seen earlier that morning, so this time is an upper bound on onset.
    onset: "2021-08-05T17:55:00Z"
    window_start: "2021-05-06"
    window_end: "2021-08-17"
    fdsn_url: https://service.earthscope.org
    network: AV
    station: PN7A   # 6.8 km from the summit
    channel: BHZ
    sources:
      - "AVO: https://avo.alaska.edu/eruption/pavlof-2021-08"
      - "AVO HANS: https://volcanoes.usgs.gov/hans2/view/notice/DOI-USGS-AVO-2021-08-05T09:00:57-08:00"
